# Shared defaults for every run. Algo files (configs/algo/*.yaml) and CLI overrides
# (key.sub=value) are merged on top. Hyperparameters follow the IQL paper's MuJoCo
# setting (ROADMAP Section 5); do not tune per p.
seed: 0

data:
  expert_id: mujoco/hopper/expert-v0
  simple_id: mujoco/hopper/simple-v0
  p_expert: 1.0
  n_transitions: 900000
  mixture_dir: data/mixtures
  normalize_states: true
  state_std_eps: 1.0e-3
  scale_rewards: false

net:
  hidden: [256, 256]
  log_std_min: -20.0
  log_std_max: 2.0

train:
  steps: 300000
  batch_size: 256
  lr: 3.0e-4
  log_every: 1000
  eval_every: 5000
  checkpoint_every: 25000
  actor_cosine_lr: true  # cosine decay to 0 over `steps`, actor only; BC and IQL alike (Phase 4 D2)
  device: auto
  num_threads: null  # null = torch default; Phase 6 bundles set cpus_per_task // runs_per_bundle
  out_dir: runs
  run_suffix: ""  # appended to {algo}_p{p}_s{seed}, e.g. "_tau0.9" for Phase 8 ablations

eval:
  episodes: 10
  seed_offset: 20000  # development seeds (Phases 4-6); the final grid uses 10000 (ROADMAP Phase 4)
  final_score_last_n: 5
  final_episodes: 50  # the last final_score_last_n evaluations use this many episodes (Phase 4 D1)

score:
  # ADR-6: score = 100 * (R - r_random) / (r_expert - r_random). Written by
  # `python scripts/eda.py --write-config`; r_simple is a reference line only.
  r_random: 17.02882347293913
  r_expert: 3857.803603002423
  r_simple: 1655.6250879864187

algo:
  name: bc
