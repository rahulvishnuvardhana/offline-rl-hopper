exclude: ^(src/offrl/_vendor/|report/phase6/dryrun/)  # kept byte-for-byte: vendored (tests/test_corl.py, I12); archived dry-run evidence (SHA256SUMS)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
